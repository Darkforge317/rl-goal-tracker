name: 🚀 Feature Request
description: Request a new feature!
title: "[Feature]: "
labels: ["Feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to submit a feature request!

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Is there an existing request for this?
      description: Please search before submitting. If you find an existing request, share your support within it instead of creating a duplicate.
      options:
        - label: I have searched the existing requests and there is no existing request for this feature.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: value-prop
    attributes:
      label: Why would this be useful?
      description: What would this make easier, faster, or more useful for people using the plugin?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Anything else that might help explain the request (mockups, examples from other plugins, etc.)
    validations:
      required: false

  - type: markdown
    attributes:
      value: "Thanks for submitting a feature request! You're helping make the plugin better for everyone."